service:
  name: identity-service
  environment: production
  version: 0.1.0
  log_level: info

grpc:
  host: 0.0.0.0
  port: 50051
  tls_enabled: false   # set true + provide cert_file/key_file/ca_file for mTLS

auth:
  jwt_secret: ""           # REQUIRED: set via VINCTUM_AUTH_JWT_SECRET env var
  jwt_expiry: 15m          # shorter access token for production
  refresh_expiry: 168h
  bcrypt_cost: 12

database:
  driver: postgres
  dsn: ""                  # REQUIRED: set via VINCTUM_DATABASE_DSN env var (use sslmode=require)
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

p2p:
  listen_addresses:
    - /ip4/0.0.0.0/tcp/4001
    - /ip4/0.0.0.0/udp/4001/quic-v1
  enable_dht: true
  enable_relay: true

wireguard:
  enabled: false
  dry_run: false
