syntax = "proto3";

package transfer.v1;

option go_package = "github.com/saitddundar/vinctum-core/proto/transfer/v1;transferv1";

import "google/protobuf/timestamp.proto";
import "routing/v1/routing.proto";

service TransferService {
  // Initiates a new file/data transfer session.
  rpc InitiateTransfer(InitiateTransferRequest) returns (InitiateTransferResponse);

  // Streams encrypted data chunks from sender to the service (client streaming).
  rpc SendChunk(stream SendChunkRequest) returns (SendChunkResponse);

  // Streams encrypted data chunks to the receiver (server streaming).
  rpc ReceiveChunks(ReceiveChunksRequest) returns (stream DataChunk);

  // Queries the current status of a transfer.
  rpc GetTransferStatus(GetTransferStatusRequest) returns (GetTransferStatusResponse);

  // Lists transfers associated with a node.
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse);

  // Cancels an in-progress transfer.
  rpc CancelTransfer(CancelTransferRequest) returns (CancelTransferResponse);

  // Streams transfer events (new/updated/completed) for a given node so
  // receivers can react to incoming transfers without polling.
  rpc WatchTransfers(WatchTransfersRequest) returns (stream TransferEvent);

  // Returns P2P connection info (peer ID, multiaddrs) for direct transfer.
  rpc GetP2PConnectionInfo(GetP2PConnectionInfoRequest) returns (GetP2PConnectionInfoResponse);

  // Reports the result of a direct P2P transfer attempt.
  rpc ConfirmP2PTransfer(ConfirmP2PTransferRequest) returns (ConfirmP2PTransferResponse);

  // Accepts or rejects a pending incoming transfer.
  rpc RespondToTransfer(RespondToTransferRequest) returns (RespondToTransferResponse);

  // Initiates a group transfer: sends a file to all devices in a session.
  // Chunks are stored once; each recipient gets a wrapped file key.
  rpc InitiateGroupTransfer(InitiateGroupTransferRequest) returns (InitiateGroupTransferResponse);

  // Lists transfers belonging to a group transfer.
  rpc ListGroupTransfers(ListGroupTransfersRequest) returns (ListGroupTransfersResponse);

  // Platform Stats (public, no auth required)
  rpc GetTransferStats(GetTransferStatsRequest) returns (GetTransferStatsResponse);

  // Admin
  rpc AdminListTransfers(AdminListTransfersRequest) returns (AdminListTransfersResponse);
}

// ─── InitiateTransfer ────────────────────────────────────

message InitiateTransferRequest {
  string sender_node_id   = 1;
  string receiver_node_id = 2;
  string filename          = 3;
  int64  total_size_bytes  = 4;
  string content_hash      = 5; // SHA-256 hash of the entire payload
  string encryption_key    = 6 [deprecated = true]; // DEPRECATED: must be empty. Chunks are E2E encrypted client-side; the server rejects requests that include a key.
  int32  chunk_size_bytes  = 7; // Size per chunk in bytes (default: 256KB)
  int32  replication_factor = 8; // Number of copies across the network (default: 1)
  bytes  sender_ephemeral_pubkey = 9; // Sender's ephemeral X25519 public key (32 bytes) for ECDH key agreement
  bool   auto_approve = 10; // When true, skip approval (same-user device transfers)
}

message InitiateTransferResponse {
  string transfer_id  = 1;
  int32  total_chunks = 2;
  TransferStatus status = 3;
  google.protobuf.Timestamp created_at = 4;
  repeated routing.v1.RouteHop route_hops = 5; // Computed route for this transfer
  bytes  sender_ephemeral_pubkey = 6; // Echo back so sender can verify storage
  TransferMode transfer_mode = 7; // Indicates whether P2P is available
  string receiver_peer_id = 8; // libp2p peer ID of receiver (if P2P available)
  repeated string receiver_addrs = 9; // libp2p multiaddrs of receiver
}

// ─── SendChunk ───────────────────────────────────────────

message SendChunkRequest {
  string transfer_id = 1;
  int32  chunk_index = 2;
  bytes  data        = 3; // Ciphertext chunk (client-side AES-256-GCM); the server never sees plaintext.
  string chunk_hash  = 4; // SHA-256 of the ciphertext for transport integrity.
}

message SendChunkResponse {
  string transfer_id     = 1;
  int32  chunks_received = 2;
  int32  total_chunks    = 3;
  TransferStatus status  = 4;
}

// ─── ReceiveChunks ───────────────────────────────────────

message ReceiveChunksRequest {
  string transfer_id      = 1;
  int32  start_chunk      = 2; // Starting chunk index for resumable downloads
  string receiver_node_id = 3;
}

message DataChunk {
  string transfer_id = 1;
  int32  chunk_index = 2;
  bytes  data        = 3;
  string chunk_hash  = 4;
  bool   is_last     = 5;
}

// ─── GetTransferStatus ───────────────────────────────────

message GetTransferStatusRequest {
  string transfer_id = 1;
}

message GetTransferStatusResponse {
  string transfer_id        = 1;
  TransferStatus status     = 2;
  int32  chunks_transferred = 3;
  int32  total_chunks       = 4;
  int64  bytes_transferred  = 5;
  int64  total_bytes        = 6;
  google.protobuf.Timestamp started_at  = 7;
  google.protobuf.Timestamp updated_at  = 8;
  bytes  sender_ephemeral_pubkey = 9; // Ephemeral pubkey for receiver-side key derivation
  string group_transfer_id = 10; // Non-empty if part of a group transfer
  bytes  wrapped_file_key  = 11; // For group transfers: wrapped AES key for this recipient
}

// ─── ListTransfers ───────────────────────────────────────

message ListTransfersRequest {
  string node_id = 1; // List transfers belonging to this node
  TransferStatus filter_status = 2;
}

message ListTransfersResponse {
  repeated TransferInfo transfers = 1;
}

message TransferInfo {
  string transfer_id       = 1;
  string sender_node_id    = 2;
  string receiver_node_id  = 3;
  string filename          = 4;
  int64  total_size_bytes  = 5;
  TransferStatus status    = 6;
  int32  progress_percent  = 7;
  google.protobuf.Timestamp created_at = 8;
  bytes  sender_ephemeral_pubkey = 9; // Ephemeral X25519 pubkey; receiver needs this to derive the decryption key
  string content_hash = 10; // Content hash covering the ephemeral pubkey (MITM binding)
  TransferMode transfer_mode = 11; // How this transfer is being conducted
  string group_transfer_id = 12; // Non-empty if part of a group transfer
  bytes  wrapped_file_key  = 13; // For group transfers: AES file key wrapped for this recipient
}

// ─── CancelTransfer ─────────────────────────────────────

message CancelTransferRequest {
  string transfer_id = 1;
  string reason       = 2;
}

message CancelTransferResponse {
  bool   success = 1;
  string message = 2;
}

// ─── WatchTransfers ─────────────────────────────────────

message WatchTransfersRequest {
  string node_id = 1; // Watch transfers where this node is sender or receiver
  // If true, only events where this node is the receiver will be emitted.
  // Useful for receivers that only care about incoming transfers.
  bool   receiver_only = 2;
}

message TransferEvent {
  EventType type = 1;
  TransferInfo transfer = 2;
  google.protobuf.Timestamp timestamp = 3;

  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EVENT_TYPE_NEW         = 1; // First time we see this transfer
    EVENT_TYPE_UPDATED     = 2; // Status or progress changed
    EVENT_TYPE_COMPLETED   = 3; // Reached terminal completed state
    EVENT_TYPE_CANCELLED   = 4; // Reached terminal cancelled/failed state
  }
}

// ─── Enums ──────────────────────────────────────────────

enum TransferStatus {
  TRANSFER_STATUS_UNSPECIFIED = 0;
  TRANSFER_STATUS_PENDING     = 1;
  TRANSFER_STATUS_IN_PROGRESS = 2;
  TRANSFER_STATUS_COMPLETED   = 3;
  TRANSFER_STATUS_FAILED      = 4;
  TRANSFER_STATUS_CANCELLED   = 5;
  TRANSFER_STATUS_AWAITING_APPROVAL = 6;
}

enum TransferMode {
  TRANSFER_MODE_UNSPECIFIED  = 0;
  TRANSFER_MODE_RELAY        = 1; // Store-and-forward via server
  TRANSFER_MODE_P2P_DIRECT   = 2; // Direct libp2p stream
  TRANSFER_MODE_P2P_RELAYED  = 3; // libp2p via circuit relay
}

// ─── P2P Connection Info ────────────────────────────────

message GetP2PConnectionInfoRequest {
  string transfer_id = 1;
}

message GetP2PConnectionInfoResponse {
  string receiver_peer_id       = 1;
  repeated string receiver_addrs = 2; // libp2p multiaddrs
  bool   direct_reachable       = 3;
  repeated string relay_addrs   = 4; // circuit relay addresses if behind NAT
}

// ─── Confirm P2P Transfer ───────────────────────────────

message ConfirmP2PTransferRequest {
  string transfer_id       = 1;
  string confirming_node_id = 2;
  int32  chunks_transferred = 3;
  bool   success            = 4;
  string error_message      = 5;
}

message ConfirmP2PTransferResponse {
  bool           success = 1;
  TransferStatus status  = 2;
}

// ─── RespondToTransfer ──────────────────────────────

message RespondToTransferRequest {
  string transfer_id      = 1;
  string receiver_node_id = 2;
  bool   accept           = 3;
}

message RespondToTransferResponse {
  string         transfer_id = 1;
  TransferStatus status      = 2;
}

// ─── Group Transfer ────────────────────────────────

// Per-recipient wrapped key: the random AES file key encrypted via
// ECDH(sender_ephemeral, receiver_static_pub).
message RecipientKey {
  string receiver_node_id = 1;
  bytes  wrapped_file_key = 2; // AES-256-GCM encrypted file key
}

message InitiateGroupTransferRequest {
  string session_id              = 1; // Target session containing recipient devices
  string sender_node_id          = 2;
  string filename                = 3;
  int64  total_size_bytes        = 4;
  string content_hash            = 5;
  int32  chunk_size_bytes        = 6;
  bytes  sender_ephemeral_pubkey = 7; // Single ephemeral key for all recipients
  repeated RecipientKey recipient_keys = 8; // One wrapped file key per recipient
}

message InitiateGroupTransferResponse {
  string group_transfer_id          = 1; // Upload chunks using this ID
  int32  total_chunks               = 2;
  repeated TransferInfo transfers   = 3; // One per recipient (each has its own transfer_id)
  google.protobuf.Timestamp created_at = 4;
}

message GroupTransferInfo {
  string group_transfer_id          = 1;
  string session_id                 = 2;
  string sender_node_id             = 3;
  string filename                   = 4;
  int64  total_size_bytes           = 5;
  int32  total_chunks               = 6;
  repeated TransferInfo transfers   = 7; // Per-recipient transfer statuses
  google.protobuf.Timestamp created_at = 8;
}

message ListGroupTransfersRequest {
  string session_id = 1;
}

message ListGroupTransfersResponse {
  repeated GroupTransferInfo group_transfers = 1;
}

// ─── Platform Stats ───────────────────────────────

message GetTransferStatsRequest {}
message GetTransferStatsResponse {
  int64 total_transfers    = 1;
  int64 total_bytes        = 2;
}

message AdminTransfer {
  string transfer_id       = 1;
  string sender_node_id    = 2;
  string receiver_node_id  = 3;
  string filename          = 4;
  int64  total_size_bytes  = 5;
  int32  status            = 6;
  int32  chunks_done       = 7;
  int32  total_chunks      = 8;
  string content_hash      = 9;
  int32  transfer_mode     = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message AdminListTransfersRequest {
  int32 limit  = 1;
  int32 offset = 2;
}
message AdminListTransfersResponse {
  repeated AdminTransfer transfers = 1;
  int64 total = 2;
}
