syntax = "proto3";

package identity.v1;

option go_package = "github.com/saitddundar/vinctum-core/proto/identity/v1;identityv1";

import "google/protobuf/timestamp.proto";

service IdentityService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse);

  // Device Management
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  rpc UpdateDeviceActivity(UpdateDeviceActivityRequest) returns (UpdateDeviceActivityResponse);
  rpc UpdateDeviceVisibility(UpdateDeviceVisibilityRequest) returns (UpdateDeviceVisibilityResponse);

  // Device Pairing
  rpc GeneratePairingCode(GeneratePairingCodeRequest) returns (GeneratePairingCodeResponse);
  rpc RedeemPairingCode(RedeemPairingCodeRequest) returns (RedeemPairingCodeResponse);
  rpc ApprovePairing(ApprovePairingRequest) returns (ApprovePairingResponse);

  // Peer Sessions
  rpc CreatePeerSession(CreatePeerSessionRequest) returns (CreatePeerSessionResponse);
  rpc ListPeerSessions(ListPeerSessionsRequest) returns (ListPeerSessionsResponse);
  rpc ClosePeerSession(ClosePeerSessionRequest) returns (ClosePeerSessionResponse);
  rpc JoinPeerSession(JoinPeerSessionRequest) returns (JoinPeerSessionResponse);
  rpc LeavePeerSession(LeavePeerSessionRequest) returns (LeavePeerSessionResponse);
  rpc ListSessionDevices(ListSessionDevicesRequest) returns (ListSessionDevicesResponse);

  // Device Keys (E2E key exchange)
  rpc UploadDeviceKey(UploadDeviceKeyRequest) returns (UploadDeviceKeyResponse);
  rpc GetDeviceKey(GetDeviceKeyRequest) returns (GetDeviceKeyResponse);
  rpc GetSessionDeviceKeys(GetSessionDeviceKeysRequest) returns (GetSessionDeviceKeysResponse);

  // Friends
  rpc SendFriendRequest(SendFriendRequestReq) returns (SendFriendRequestResp);
  rpc RespondToFriendRequest(RespondToFriendRequestReq) returns (RespondToFriendRequestResp);
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  rpc ListFriendRequests(ListFriendRequestsRequest) returns (ListFriendRequestsResponse);
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  rpc GetNotificationCount(GetNotificationCountRequest) returns (GetNotificationCountResponse);
  rpc ListFriendDevices(ListFriendDevicesRequest) returns (ListFriendDevicesResponse);

  // Presence
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse);

  // Avatar
  rpc UpdateAvatar(UpdateAvatarRequest) returns (UpdateAvatarResponse);
  rpc GetAvatar(GetAvatarRequest) returns (GetAvatarResponse);

  // Platform Stats (public, no auth required)
  rpc GetPlatformStats(GetPlatformStatsRequest) returns (GetPlatformStatsResponse);

  // Admin
  rpc AdminListUsers(AdminListUsersRequest) returns (AdminListUsersResponse);
  rpc AdminListDevices(AdminListDevicesRequest) returns (AdminListDevicesResponse);
  rpc AdminListAuditLogs(AdminListAuditLogsRequest) returns (AdminListAuditLogsResponse);
}

message RegisterRequest {
  string username = 1;
  string email    = 2;
  string password = 3;
}

message RegisterResponse {
  string user_id   = 1;
  string username  = 2;
  string email     = 3;
  google.protobuf.Timestamp created_at = 4;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_in    = 3;
  User   user          = 4;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool   valid   = 1;
  string user_id = 2;
  string email   = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_in    = 3;
}

message LogoutRequest {
  string user_id       = 1;
  string refresh_token = 2;
}

message LogoutResponse {
  bool success = 1;
}

message User {
  string user_id   = 1;
  string username  = 2;
  string email     = 3;
  google.protobuf.Timestamp created_at = 4;
  bool   email_verified = 5;
  string avatar_data    = 6;  // base64-encoded image (data URI prefix included)
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  bool   success = 1;
  string message = 2;
}

message ResendVerificationRequest {
  string email = 1;
}

message ResendVerificationResponse {
  bool   success = 1;
  string message = 2;
}

// ─── Device types ──────────────────────────────────

enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_PC          = 1;
  DEVICE_TYPE_PHONE       = 2;
  DEVICE_TYPE_TABLET      = 3;
}

message Device {
  string device_id                         = 1;
  string user_id                           = 2;
  string name                              = 3;
  DeviceType device_type                   = 4;
  string node_id                           = 5;
  string fingerprint                       = 6;
  bool   is_approved                       = 7;
  google.protobuf.Timestamp approved_at    = 8;
  string approved_by_device_id             = 9;
  google.protobuf.Timestamp last_active    = 10;
  google.protobuf.Timestamp created_at     = 11;
  bool   is_revoked                        = 12;
  bool   is_public                         = 13;
}

message RegisterDeviceRequest {
  string name            = 1;
  DeviceType device_type = 2;
  string fingerprint     = 3;
  string node_id         = 4;
  bool   is_public       = 5;
}
message RegisterDeviceResponse {
  Device device = 1;
}

message ListDevicesRequest {}
message ListDevicesResponse {
  repeated Device devices = 1;
}

message GetDeviceRequest {
  string device_id = 1;
}
message GetDeviceResponse {
  Device device = 1;
}

message RevokeDeviceRequest {
  string device_id = 1;
}
message RevokeDeviceResponse {
  bool success = 1;
}

message UpdateDeviceActivityRequest {
  string device_id = 1;
  string node_id   = 2;
}
message UpdateDeviceActivityResponse {
  bool success = 1;
}

message UpdateDeviceVisibilityRequest {
  string device_id = 1;
  bool   is_public = 2;
}
message UpdateDeviceVisibilityResponse {
  bool success = 1;
}

// ─── Pairing types ─────────────────────────────────

message GeneratePairingCodeRequest {
  string device_id = 1;
}
message GeneratePairingCodeResponse {
  string pairing_code = 1;
  int32  expires_in_s = 2;
}

message RedeemPairingCodeRequest {
  string pairing_code    = 1;
  string name            = 2;
  DeviceType device_type = 3;
  string fingerprint     = 4;
  string node_id         = 5;
}
message RedeemPairingCodeResponse {
  string device_id       = 1;
  string approver_device = 2;
}

message ApprovePairingRequest {
  string approver_device_id = 1;
  string pending_device_id  = 2;
  bool   approve            = 3;
}
message ApprovePairingResponse {
  bool   success = 1;
  Device device  = 2;
}

// ─── Peer Session types ────────────────────────────

message PeerSession {
  string session_id                        = 1;
  string user_id                           = 2;
  string name                              = 3;
  bool   is_active                         = 4;
  repeated Device devices                  = 5;
  google.protobuf.Timestamp created_at     = 6;
  google.protobuf.Timestamp closed_at      = 7;
}

message CreatePeerSessionRequest {
  string name      = 1;
  string device_id = 2;
}
message CreatePeerSessionResponse {
  PeerSession session = 1;
}

message ListPeerSessionsRequest {}
message ListPeerSessionsResponse {
  repeated PeerSession sessions = 1;
}

message ClosePeerSessionRequest {
  string session_id = 1;
}
message ClosePeerSessionResponse {
  bool success = 1;
}

message JoinPeerSessionRequest {
  string session_id = 1;
  string device_id  = 2;
}
message JoinPeerSessionResponse {
  bool success = 1;
}

message LeavePeerSessionRequest {
  string session_id = 1;
  string device_id  = 2;
}
message LeavePeerSessionResponse {
  bool success = 1;
}

message ListSessionDevicesRequest {
  string session_id = 1;
}
message ListSessionDevicesResponse {
  repeated Device devices = 1;
}

// ─── Device Key types ──────────────────────────────

message DeviceKey {
  string device_id                      = 1;
  string kex_algo                       = 2;  // e.g. "x25519"
  bytes  kex_public_key                 = 3;
  google.protobuf.Timestamp created_at  = 4;
  google.protobuf.Timestamp rotated_at  = 5;
}

message UploadDeviceKeyRequest {
  string device_id      = 1;
  string kex_algo       = 2;  // optional, defaults to "x25519"
  bytes  kex_public_key = 3;
}
message UploadDeviceKeyResponse {
  DeviceKey key = 1;
}

message GetDeviceKeyRequest {
  string device_id = 1;
}
message GetDeviceKeyResponse {
  DeviceKey key = 1;
}

message GetSessionDeviceKeysRequest {
  string session_id = 1;
}
message GetSessionDeviceKeysResponse {
  repeated DeviceKey keys = 1;
}

// ─── Friend types ──────────────────────────────────

message UserInfo {
  string user_id  = 1;
  string username = 2;
  string email    = 3;
}

message Friend {
  string   id         = 1;
  UserInfo user       = 2;
  string   status     = 3;
  google.protobuf.Timestamp created_at = 4;
}

message SendFriendRequestReq {
  string addressee_user_id = 1;
}
message SendFriendRequestResp {
  Friend friendship = 1;
}

message RespondToFriendRequestReq {
  string friendship_id = 1;
  bool   accept        = 2;
}
message RespondToFriendRequestResp {
  Friend friendship = 1;
}

message ListFriendsRequest {}
message ListFriendsResponse {
  repeated Friend friends = 1;
}

message ListFriendRequestsRequest {}
message ListFriendRequestsResponse {
  repeated Friend requests = 1;
}

message RemoveFriendRequest {
  string friendship_id = 1;
}
message RemoveFriendResponse {
  bool success = 1;
}

message SearchUsersRequest {
  string query = 1;
}
message SearchUsersResponse {
  repeated UserInfo users = 1;
}

message GetNotificationCountRequest {}
message GetNotificationCountResponse {
  int32 friend_requests      = 1;
  int32 incoming_transfers   = 2;
  int32 total                = 3;
}

message ListFriendDevicesRequest {
  string friend_user_id = 1;
}
message ListFriendDevicesResponse {
  repeated Device devices = 1;
}

// ─── Presence types ───────────────────────────────

message HeartbeatRequest {
  string device_id = 1;
}
message HeartbeatResponse {
  bool success = 1;
}

message PresenceInfo {
  string   user_id   = 1;
  string   device_id = 2;
  google.protobuf.Timestamp last_seen = 3;
  bool     online    = 4;  // true if last_seen < 60s ago
}

message GetPresenceRequest {
  repeated string user_ids = 1;
}
message GetPresenceResponse {
  repeated PresenceInfo presence = 1;
}

// ─── Avatar types ─────────────────────────────────

message UpdateAvatarRequest {
  string avatar_data = 1;  // base64 data URI e.g. "data:image/jpeg;base64,..."
}
message UpdateAvatarResponse {
  bool success = 1;
}

message GetAvatarRequest {
  string user_id = 1;
}
message GetAvatarResponse {
  string avatar_data = 1;
}

// ─── Platform Stats ───────────────────────────────

message GetPlatformStatsRequest {}
message GetPlatformStatsResponse {
  int64 total_users   = 1;
  int64 total_devices = 2;
}

// ─── Admin ────────────────────────────────────────

message AdminUser {
  string user_id        = 1;
  string username       = 2;
  string email          = 3;
  bool   email_verified = 4;
  google.protobuf.Timestamp created_at = 5;
}

message AdminListUsersRequest {
  int32 limit  = 1;
  int32 offset = 2;
}
message AdminListUsersResponse {
  repeated AdminUser users = 1;
  int64 total = 2;
}

message AdminDevice {
  string device_id       = 1;
  string user_id         = 2;
  string name            = 3;
  DeviceType device_type = 4;
  string node_id         = 5;
  bool   is_approved     = 6;
  bool   is_revoked      = 7;
  bool   is_public       = 8;
  string owner_username  = 9;
  string owner_email     = 10;
  google.protobuf.Timestamp last_active = 11;
  google.protobuf.Timestamp created_at  = 12;
}

message AdminListDevicesRequest {
  int32 limit  = 1;
  int32 offset = 2;
}
message AdminListDevicesResponse {
  repeated AdminDevice devices = 1;
  int64 total = 2;
}

message AuditLog {
  int64  id          = 1;
  string user_id     = 2;
  string method      = 3;
  string code        = 4;
  string peer_addr   = 5;
  int64  duration_ms = 6;
  google.protobuf.Timestamp created_at = 7;
}

message AdminListAuditLogsRequest {
  int32 limit  = 1;
  int32 offset = 2;
}
message AdminListAuditLogsResponse {
  repeated AuditLog logs = 1;
  int64 total = 2;
}
