services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vinctum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vinctum}
      POSTGRES_DB: vinctum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinctum"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me-in-prod} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-in-prod}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.identity
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VINCTUM_SERVICE_NAME: identity-service
      VINCTUM_GRPC_PORT: 50051
      VINCTUM_DATABASE_DSN: postgres://vinctum:${POSTGRES_PASSWORD:-vinctum}@postgres:5432/vinctum?sslmode=prefer
      VINCTUM_AUTH_JWT_SECRET: ${JWT_SECRET}
      VINCTUM_REDIS_ADDR: redis:6379
      VINCTUM_REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-in-prod}
    ports:
      - "50051:50051"
      - "51051:51051"  # metrics
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:51051/metrics > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  discovery:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.discovery
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VINCTUM_SERVICE_NAME: discovery-service
      VINCTUM_GRPC_PORT: 50052
      VINCTUM_DATABASE_DSN: postgres://vinctum:${POSTGRES_PASSWORD:-vinctum}@postgres:5432/vinctum?sslmode=prefer
    ports:
      - "50052:50052"
      - "4001:4001/tcp"
      - "4001:4001/udp"
      - "51052:51052"  # metrics
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:51052/metrics > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ml:
  #   build:
  #     context: ../../../vinctum-ml
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   environment:
  #     VINCTUM_ML_LOG_LEVEL: info
  #     VINCTUM_ML_WORKERS: 2
  #     VINCTUM_ML_API_KEY: ${ML_API_KEY:-}
  #   ports:
  #     - "8000:8000"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

  routing:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.routing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_healthy
    environment:
      VINCTUM_SERVICE_NAME: routing-service
      VINCTUM_GRPC_PORT: 50053
      VINCTUM_DATABASE_DSN: postgres://vinctum:${POSTGRES_PASSWORD:-vinctum}@postgres:5432/vinctum?sslmode=prefer
      VINCTUM_AUTH_JWT_SECRET: ${JWT_SECRET}
      VINCTUM_DISCOVERY_ADDR: discovery:50052
    ports:
      - "50053:50053"
      - "51053:51053"  # metrics
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:51053/metrics > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  transfer:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.transfer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      routing:
        condition: service_healthy
    environment:
      VINCTUM_SERVICE_NAME: transfer-service
      VINCTUM_GRPC_PORT: 50054
      VINCTUM_DATABASE_DSN: postgres://vinctum:${POSTGRES_PASSWORD:-vinctum}@postgres:5432/vinctum?sslmode=prefer
      VINCTUM_AUTH_JWT_SECRET: ${JWT_SECRET}
      VINCTUM_ROUTING_ADDR: routing:50053
      VINCTUM_DISCOVERY_ADDR: discovery:50052
    ports:
      - "50054:50054"
      - "51054:51054"  # metrics
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:51054/metrics > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy
      discovery:
        condition: service_healthy
      routing:
        condition: service_healthy
      transfer:
        condition: service_healthy
    environment:
      VINCTUM_SERVICE_NAME: gateway-service
      VINCTUM_GATEWAY_HTTP_PORT: 8080
      VINCTUM_GATEWAY_IDENTITY_ADDR: identity:50051
      VINCTUM_GATEWAY_DISCOVERY_ADDR: discovery:50052
      VINCTUM_GATEWAY_ROUTING_ADDR: routing:50053
      VINCTUM_GATEWAY_TRANSFER_ADDR: transfer:50054
      VINCTUM_AUTH_JWT_SECRET: ${JWT_SECRET}
      VINCTUM_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8081,http://localhost:8082}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
