# Vinctum secrets — do NOT commit real values.
# Populate these via: kubectl create secret generic vinctum-secrets -n vinctum \
#   --from-literal=jwt-secret=<your-secret> \
#   --from-literal=postgres-password=<your-password> \
#   --from-literal=redis-password=<your-password> \
#   --from-literal=postgres-dsn=<full-dsn-with-sslmode=require>
#
# Or use Sealed Secrets / External Secrets Operator in production.
apiVersion: v1
kind: Secret
metadata:
  name: vinctum-secrets
  namespace: vinctum
type: Opaque
stringData:
  jwt-secret: "REPLACE_ME"
  postgres-password: "REPLACE_ME"
  redis-password: "REPLACE_ME"
  postgres-dsn: "postgres://vinctum:REPLACE_ME@postgres:5432/vinctum?sslmode=require"
