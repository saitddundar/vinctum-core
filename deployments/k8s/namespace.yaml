apiVersion: v1
kind: Namespace
metadata:
  name: vinctum
  labels:
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: vinctum-quota
  namespace: vinctum
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "30"
