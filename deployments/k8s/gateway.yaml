apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: vinctum
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: ghcr.io/saitddundar/vinctum-core/gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: VINCTUM_SERVICE_NAME
              value: gateway-service
            - name: VINCTUM_GATEWAY_HTTP_PORT
              value: "8080"
            - name: VINCTUM_GATEWAY_IDENTITY_ADDR
              value: identity:50051
            - name: VINCTUM_GATEWAY_DISCOVERY_ADDR
              value: discovery:50052
            - name: VINCTUM_GATEWAY_ROUTING_ADDR
              value: routing:50053
            - name: VINCTUM_GATEWAY_TRANSFER_ADDR
              value: transfer:50054
            - name: VINCTUM_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vinctum-secrets
                  key: jwt-secret
            - name: VINCTUM_CORS_ORIGINS
              value: "https://app.vinctum.io"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: vinctum
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Ingress: adjust host/tls for your cluster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: vinctum
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "11m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.vinctum.io
      secretName: vinctum-tls
  rules:
    - host: api.vinctum.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
